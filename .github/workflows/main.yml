name: Build Minecraft Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract mod.zip safely
      run: |
        echo "Listing current files:"
        ls -la
        if [ -f mod.zip ]; then
          # فك الضغط وتجاوز المجلدات الوهمية
          unzip -o mod.zip -d extracted_mod
          cp -r extracted_mod/*/* . 2>/dev/null || cp -r extracted_mod/* . 2>/dev/null || true
        fi
        echo "Files after extraction:"
        ls -la

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build --no-daemon

    - name: Upload Mod Jar
      uses: actions/upload-artifact@v4
      with:
        name: BetterNightVision-JAR
        path: build/libs/*.jar
