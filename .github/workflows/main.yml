name: Build Minecraft Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip project files
      run: |
        echo "=== Files before unzip ==="
        ls -la
        if [ -f mod.zip ]; then
          unzip -o mod.zip
          # إذا كانت الملفات مطمورة بداخل مجلد فرعي
          find . -maxdepth 2 -name "gradlew" -exec cp {} . \;
          find . -maxdepth 2 -name "build.gradle" -exec cp -r $(dirname {})/* . \; 2>/dev/null || true
        fi
        echo "=== Files after unzip ==="
        ls -la

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x gradlew || true

    - name: Build with Gradle
      run: ./gradlew build --no-daemon

    - name: Upload Mod Jar
      uses: actions/upload-artifact@v4
      with:
        name: BetterNightVision-JAR
        path: build/libs/*.jar
