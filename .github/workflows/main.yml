name: Build Minecraft Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup environment and build
      run: |
        if ls *.zip 1> /dev/null 2>&1; then
          for file in *.zip; do
            unzip -o "$file"
          done
          GRADLE_FILE=$(find . -name "gradlew" -print -quit)
          if [ -n "$GRADLE_FILE" ]; then
            DIR_PATH=$(dirname "$GRADLE_FILE")
            if [ "$DIR_PATH" != "." ]; then
              cp -rn "$DIR_PATH"/* . 2>/dev/null || true
            fi
          fi
        fi

        if [ ! -f "gradlew" ]; then
          gradle wrapper --gradle-version 8.8
        fi
        
        chmod +x gradlew || true
        ./gradlew build --no-daemon

    - name: Upload Mod Jar
      uses: actions/upload-artifact@v4
      with:
        name: BetterNightVision-JAR
        path: build/libs/*.jar
