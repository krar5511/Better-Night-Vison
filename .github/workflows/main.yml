name: Build Minecraft Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Find and extract any zip file
      run: |
        # فك ضغط أي ملف zip موجود بالمستودع تلقائياً
        for file in *.zip; do
          if [ -f "$file" ]; then
            echo "Extracting $file..."
            unzip -o "$file" -d extracted_content
          fi
        done

        # البحث عن مكان gradlew ونقل كل ملفات المشروع للجذر
        GRADLE_FILE=$(find . -name "gradlew" -print -quit)
        if [ -n "$GRADLE_FILE" ]; then
          DIR_PATH=$(dirname "$GRADLE_FILE")
          echo "Found gradlew at $DIR_PATH, moving files..."
          cp -rn "$DIR_PATH"/* . 2>/dev/null || true
          cp -rn "$DIR_PATH"/.* . 2>/dev/null || true
        else
          echo "ERROR: gradlew file not found anywhere!"
          exit 1
        fi

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x gradlew || true

    - name: Build with Gradle
      run: ./gradlew build --no-daemon

    - name: Upload Mod Jar
      uses: actions/upload-artifact@v4
      with:
        name: BetterNightVision-JAR
        path: build/libs/*.jar
