name: Build Minecraft Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Mod
      run: |
        if ls *.zip 1> /dev/null 2>&1; then
          for f in *.zip; do unzip -o "$f"; done
        fi
        
        # البحث عن مجلد المشروع ورفع الملفات للجذر
        if [ -d "better-night-vision-template-26.2" ]; then
          cp -r better-night-vision-template-26.2/* .
        fi
        
        if [ ! -f "gradlew" ]; then
          gradle wrapper --gradle-version 8.8
        fi
        
        chmod +x gradlew
        ./gradlew build --no-daemon

    - name: Upload Mod Jar
      uses: actions/upload-artifact@v4
      with:
        name: BetterNightVision-JAR
        path: build/libs/*.jar
