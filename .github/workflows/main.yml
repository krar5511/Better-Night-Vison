
name: Build Minecraft Mod

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Find and build mod
        shell: bash
        run: |
          set -e

          if ls *.zip >/dev/null 2>&1; then
            for f in *.zip; do
              unzip -o "$f"
            done
          fi

          WRAPPER=$(find . -type f -name gradlew \
            -not -path '*/.gradle/*' -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found. Check project files."
            find . -maxdepth 3 -type f \
              \( -name 'build.gradle' \
              -o -name 'build.gradle.kts' \
              -o -name 'gradle-wrapper.properties' \)
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: BetterNightVision-JAR
          path: "**/build/libs/*.jar"
          if-no-files-found: error
