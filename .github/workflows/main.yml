name: Build Minecraft Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract zip if exists
      run: |
        if ls *.zip 1> /dev/null 2>&1; then
          for file in *.zip; do
            unzip -o "$file"
          done
          GRADLE_FILE=$(find . -name "gradlew" -print -quit)
          if [ -n "$GRADLE_FILE" ]; then
            DIR_PATH=$(dirname "$GRADLE_FILE")
            if [ "$DIR_PATH" != "." ]; then
              cp -rn "$DIR_PATH"/* . 2>/dev/null || true
            fi
          fi
        fi

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Check files and build
      run: |
        if [ ! -f "gradlew" ]; then
          echo "Creating wrapper fallback..."
          gradle wrapper --gradle-version 8.8
        fi
        chmod +x gradlew || true
        ./gradlew build --no-daemon

    - name: Upload Mod Jar
      uses: actions/upload-artifact@v4
      with:
        name: BetterNightVision-JAR
        path: build/libs/*.jar
